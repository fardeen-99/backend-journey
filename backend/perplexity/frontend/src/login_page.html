<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(25, 37, 64, 0.6);
            backdrop-filter: blur(24px);
            position: relative;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            inset: 0;
            padding: 1px;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(163, 166, 255, 0.3) 0%, rgba(163, 166, 255, 0) 50%, rgba(45, 183, 242, 0.1) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .grid-pattern {
            background-image: radial-gradient(rgba(163, 166, 255, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .floating-label-group:focus-within label,
        .floating-label-group input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #2db7f2;
        }
    </style>
</head>
<body class="bg-background font-body text-on-surface selection:bg-primary/30 min-h-screen flex flex-col overflow-hidden">
<!-- Ambient Background Elements -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="grid-pattern absolute inset-0 opacity-20"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute -top-24 -right-24 w-[400px] h-[400px] bg-tertiary/5 blur-[100px] rounded-full"></div>
</div>
<!-- Navigation Shell Suppressed (Transactional Page Rule) -->
<main class="relative z-10 flex-grow flex items-center justify-center px-6">
<div class="w-full max-w-md">
<!-- Branding Header -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center p-3 mb-6 rounded-xl bg-surface-container-high relative">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<div class="absolute inset-0 bg-primary/20 blur-xl rounded-full"></div>
</div>
<h1 class="font-headline text-3xl font-extrabold tracking-tighter text-on-surface mb-2">Aetheris AI</h1>
<p class="text-on-surface-variant font-medium tracking-tight">Your AI-powered search assistant</p>
</div>
<!-- Login Card -->
<div class="glass-card rounded-2xl p-8 md:p-10 shadow-2xl">
<form class="space-y-6">
<!-- Social Login -->
<button class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all duration-300 border border-outline-variant/15 text-sm font-semibold tracking-tight group" type="button">
<svg class="w-5 h-5 group-hover:scale-110 transition-transform" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 12-4.53z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<div class="relative flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/10"></div>
</div>
<span class="relative bg-transparent px-4 text-xs font-semibold text-outline tracking-widest uppercase">or</span>
</div>
<!-- Input Fields -->
<div class="space-y-4">
<div class="floating-label-group relative">
<input class="block w-full px-4 py-4 bg-surface-container-lowest/50 border-none rounded-xl text-on-surface focus:ring-2 focus:ring-secondary/50 focus:shadow-[0_0_15px_rgba(45,183,242,0.3)] transition-all peer" id="email" placeholder=" " required="" type="email"/>
<label class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none origin-left" for="email">Email address</label>
</div>
<div class="floating-label-group relative">
<input class="block w-full px-4 py-4 bg-surface-container-lowest/50 border-none rounded-xl text-on-surface focus:ring-2 focus:ring-secondary/50 focus:shadow-[0_0_15px_rgba(45,183,242,0.3)] transition-all peer" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-4 text-on-surface-variant transition-all pointer-events-none origin-left" for="password">Password</label>
</div>
</div>
<div class="flex items-center justify-end">
<a class="text-sm font-semibold text-secondary hover:text-secondary-dim transition-colors" href="#">Forgot password?</a>
</div>
<!-- Primary CTA -->
<button class="w-full py-4 px-6 bg-primary-container text-on-primary-container font-bold rounded-xl shadow-lg shadow-primary/20 hover:shadow-primary/40 hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 relative overflow-hidden group" type="submit">
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
                        Sign In
                    </button>
</form>
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm font-medium">
                        Don’t have an account? 
                        <a class="text-secondary font-bold hover:underline underline-offset-4 ml-1" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</main>
<!-- Footer Cluster (From JSON) -->
<footer class="relative z-10 w-full py-12">
<div class="flex flex-col md:flex-row justify-between items-center px-8 max-w-7xl mx-auto w-full gap-6">
<p class="font-inter text-sm text-[#a3aac4]">© 2024 Aetheris Intelligence. Atmospheric AI Design.</p>
<div class="flex gap-8">
<a class="text-[#a3aac4] hover:text-[#a3a6ff] transition-colors text-sm font-medium" href="#">Privacy Policy</a>
<a class="text-[#a3aac4] hover:text-[#a3a6ff] transition-colors text-sm font-medium" href="#">Terms of Service</a>
<a class="text-[#a3aac4] hover:text-[#a3a6ff] transition-colors text-sm font-medium" href="#">Security</a>
<a class="text-[#a3aac4] hover:text-[#a3a6ff] transition-colors text-sm font-medium" href="#">Status</a>
</div>
</div>
</footer>
